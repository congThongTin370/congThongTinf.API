name: congthongtinf

services:
  congthongtinf.api:
    image: ${DOCKER_REGISTRY-}congthongtinfapi
    build:
      context: .
      dockerfile: congThongTinf.API/Dockerfile
    depends_on:
      congthongtinf.database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

      # PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=congthongtinf.database;Port=5432;Database=CongThongTinfDB;Username=postgres;Password=postgres;Timeout=300;CommandTimeout=300

      # SeaweedFS (S3-compatible) — service lives in the congthongtinf-storage stack
      - ObjectStorage__ServiceUrl=http://congthongtinf.seaweedfs:8333
      - ObjectStorage__BucketName=congthongtin
      - ObjectStorage__PublicUrl=http://localhost:8333/congthongtin
      - ObjectStorage__AccessKey=congthongtin
      - ObjectStorage__SecretKey=congthongtin_secret
      - ObjectStorage__Region=us-east-1
      - ObjectStorage__StorageQuotaBytes=10737418240
      - Seed__ImageRoot=/app/seed/images

    volumes:
      - ./seed/images:/app/seed/images:ro

    ports:
      - "5000:8080"
      - "5001:8081"
    networks:
      - congthongtinf

  congthongtinf.database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CongThongTinfDB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CongThongTinfDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - congthongtinf

networks:
  congthongtinf:
    name: congthongtinf
    external: true

volumes:
  pgdata:
    name: congthongtinf_pgdata

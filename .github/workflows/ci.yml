name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore congThongTinf.API/congThongTinf.API.csproj

      - name: Build
        run: dotnet build congThongTinf.API/congThongTinf.API.csproj --configuration Release --no-restore --verbosity minimal

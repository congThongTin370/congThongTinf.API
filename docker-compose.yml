services:
  congthongtinf.api:
    image: ${DOCKER_REGISTRY-}congthongtinfapi
    build:
      context: .
      dockerfile: congThongTinf.API/Dockerfile
    depends_on:
      congthongtinf.database:
        condition: service_healthy
      congthongtinf.seaweedfs:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

      # PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=congthongtinf.database;Port=5432;Database=CongThongTinfDB;Username=postgres;Password=postgres;Timeout=300;CommandTimeout=300

      # SeaweedFS (S3-compatible)
      - ObjectStorage__ServiceUrl=http://congthongtinf.seaweedfs:8333
      - ObjectStorage__BucketName=congthongtin
      - ObjectStorage__PublicUrl=http://localhost:8333/congthongtin
      - ObjectStorage__AccessKey=congthongtin
      - ObjectStorage__SecretKey=congthongtin_secret
      - ObjectStorage__Region=us-east-1
      - ObjectStorage__StorageQuotaBytes=10737418240

    ports:
      - "5000:8080"
      - "5001:8081"

  congthongtinf.database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CongThongTinfDB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CongThongTinfDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  congthongtinf.seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: always
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json'
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweeddata:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  seaweeddata:

services:
  congthongtinf.api:
    image: ${DOCKER_REGISTRY-}congthongtinfapi
    build:
      context: .
      dockerfile: congThongTinf.API/Dockerfile
    depends_on:
      congthongtinf.database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

      # PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=congthongtinf.database;Port=5432;Database=CongThongTinfDB;Username=postgres;Password=postgres;Timeout=300;CommandTimeout=300

    

    ports:
      - "5000:8080"
      - "5001:8081"

  congthongtinf.database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CongThongTinfDB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CongThongTinfDB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

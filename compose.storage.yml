name: congthongtinf-storage

services:
  congthongtinf.seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: always
    command: 'server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json'
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweeddata:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - congthongtinf

networks:
  congthongtinf:
    name: congthongtinf
    external: true

volumes:
  seaweeddata:
    name: congthongtinf_seaweeddata
    external: true
